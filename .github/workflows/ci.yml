name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchora
          POSTGRES_PASSWORD: watchora
          POSTGRES_DB: blindnav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://watchora:watchora@localhost:5432/blindnav
      JWT_SECRET: ci-secret-at-least-16-chars
      CORS_ORIGIN: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
